name: AI Tools Documentation

on:
  push:
    tags:
      - 'agent-sandbox-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-tools-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox/site-docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^agent-sandbox-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            agent-sandbox/site-docs/package-lock.json
            soft-factory/site-docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Build and check documentation
        run: npm run docs:build
      - name: Install Soft Factory documentation dependencies
        working-directory: soft-factory/site-docs
        run: npm ci
      - name: Build and check Soft Factory documentation
        working-directory: soft-factory/site-docs
        run: npm run docs:build
      - name: Assemble both documentation sites
        working-directory: .
        run: |
          mkdir -p _site/soft-factory
          cp -a agent-sandbox/site-docs/guide/.vitepress/dist/. _site/
          cp -a soft-factory/site-docs/guide/.vitepress/dist/. _site/soft-factory/
      - name: Configure GitHub Pages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-sandbox-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5
      - name: Upload website
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-sandbox-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-sandbox-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
