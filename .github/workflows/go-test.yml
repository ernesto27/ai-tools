name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soft-factory
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: soft-factory/go.mod
          cache: true
          cache-dependency-path: soft-factory/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal skills)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o /tmp/software-factory ./cmd/factory

      - name: Check CLI and installer syntax
        run: |
          /tmp/software-factory -h
          bash -n install.sh

  agent-sandbox:
    name: Test agent-sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent-sandbox/go.mod
          cache: true
          cache-dependency-path: agent-sandbox/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal embed.go)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build CLI and check installer syntax
        run: |
          go build -o /tmp/agent-sandbox ./cmd/agent-sandbox
          /tmp/agent-sandbox --version
          bash -n install.sh
