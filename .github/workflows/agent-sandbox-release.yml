name: Release Agent Sandbox

on:
  push:
    tags:
      - "agent-sandbox-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent-sandbox/go.mod
          cache: true
          cache-dependency-path: agent-sandbox/go.sum

      - name: Verify release
        run: |
          go test ./...
          go vet ./...
          bash -n install.sh

      - name: Build Linux archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG}" -o dist/package/agent-sandbox ./cmd/agent-sandbox
          dist/package/agent-sandbox --version
          tar -C dist/package -czf dist/agent-sandbox_linux_amd64.tar.gz agent-sandbox
          cd dist
          sha256sum agent-sandbox_linux_amd64.tar.gz > agent-sandbox_linux_amd64.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            agent-sandbox/dist/agent-sandbox_linux_amd64.tar.gz
            agent-sandbox/dist/agent-sandbox_linux_amd64.tar.gz.sha256
